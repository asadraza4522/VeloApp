name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx jest --ci
      - run: npx expo-doctor

  native-android:
    # Kotlin unit tests for the native download engine (velo-download-engine). android/ is
    # generated (CNG, gitignored) so prebuild runs first; no emulator needed, JVM tests only.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - uses: gradle/actions/setup-gradle@v4
      - run: (cd android && ./gradlew :velo-download-engine:testDebugUnitTest :velo-download-engine:compileDebugKotlin -PreactNativeArchitectures=arm64-v8a --console=plain)

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -m "not network"

  worker-canaries:
    # Live platform checks: catches yt-dlp / extractor rot early. Non-blocking for PRs.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -m network

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: RLS + function tests (embedded Postgres)
        working-directory: supabase/tests
        run: npm install && npm test
      - uses: denoland/setup-deno@v2
      - name: Edge Function tests
        working-directory: supabase/functions/resolve
        run: deno test handler.test.ts && deno check handler.ts index.ts
