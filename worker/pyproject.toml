[project]
name = "velo-worker"
version = "0.1.0"
description = "Velo resolver worker: turns a page URL into direct media URLs. Never downloads or stores media."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "yt-dlp",          # unpinned on purpose: platforms break weekly, the image is rebuilt nightly
  "gallery-dl",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["network: hits the real internet (deselect with -m 'not network')"]
